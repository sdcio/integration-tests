apiVersion: config.sdcio.dev/v1alpha1
kind: Config
metadata:
  name: intent-cache-backend-srl
  namespace: default
  labels:
    config.sdcio.dev/targetName: srl1
    config.sdcio.dev/targetNamespace: default
spec:
  priority: 10
  revertive: false
  config:
  - path: /
    value:
      interface:
      - name: ethernet-1/10
        admin-state: "enable"
        description: "cache-backend-e2e"
