apiVersion: config.sdcio.dev/v1alpha1
kind: Config
metadata:
  name: intent-sensitive-srl-2
  namespace: default
  labels:
    config.sdcio.dev/targetName: srl1
    config.sdcio.dev/targetNamespace: default
spec:
  priority: 10
  revertive: false
  vars:
  - name: desc-a
    secretRef:
      name: sensitive-2a
      key: description
  - name: desc-b
    secretRef:
      name: sensitive-2b
      key: description
  config:
  - path: /
    value:
      interface:
      - name: ethernet-1/8
        admin-state: "enable"
        description: "${vars.desc-a}"
      - name: ethernet-1/9
        admin-state: "enable"
        description: "${vars.desc-b}"
